      - 群馬
      - 埼玉
      - 千葉
      - 東京
      - 神奈川
      - 新潟
      - 富山
      - 石川
      - 福井
      - 山梨
      - 長野
      - 岐阜
      - 静岡
      - 愛知
      - 三重
      - 滋賀
      - 京都
      - 大阪
      - 兵庫
      - 奈良
      - 和歌山
      - 鳥取
      - 島根
      - 岡山
      - 広島
      - 山口
      - 徳島
      - 香川
      - 愛媛
      - 高知
      - 福岡
      - 佐賀
      - 長崎
      - 熊本
      - 大分
      - 宮崎
      - 鹿児島
      - 沖縄
      # --- 主要市区町村・繁華街 ---
      - 札幌
      - 仙台
      - さいたま
      - 千葉市
      - 横浜
      - 川崎
      - 相模原
      - 新潟市
      - 静岡市
      - 浜松
      - 名古屋
      - 京都市
      - 大阪市
      - 梅田
      - 難波
      - 堺
      - 神戸
      - 岡山市
      - 広島市
      - 北九州
      - 福岡市
      - 天神
      - 博多
      - 熊本市
      - 鹿児島市
      - 那覇
    # 位置タグを付けるか（true=本文で選ばれた地域をそのまま位置タグ検索に使う）
    tag_location: true
    # 手挙げ＝リード判定キーワード（返信本文にこれらを含むとリード化）
    lead_keywords:
      - やりたい
      - 興味
      - 希望
      - 知りたい
      - 欲しい
      - 詳しく
      - お願い
      - 気になる
      - やってみたい
    # フロントのオファー（返信文・リード対応で参照）
    offer: "チラシ（ポスティング）の反響設計を無料診断。受け皿のHPと問い合わせ対応までセットで集客を作る。"
    # 生成の多様化軸。投稿ごとに各リストから1つずつランダムに選び、似た投稿への収束を防ぐ。
    variation:
      industries:
        - 整体院
        - 美容室
        - 飲食店
        - 工務店・リフォーム会社
        - 学習塾
        - 歯科・クリニック
        - ネイル・まつげサロン
        - 整骨院
        - カフェ・喫茶店
        - エステサロン
        - ペットサロン
        - 不動産・賃貸仲介
        - 居酒屋
        - パーソナルジム
      topics:
        - チラシ・ポスティングの配布エリア設計
        - ホームページの問い合わせ導線・作りっぱなし問題
        - 電話やLINEでの問い合わせの取りこぼし
        - Googleマップ・口コミ（MEO）対策
        - 既存客のリピート・再来店の仕組み
        - 看板・のぼり・店頭の見せ方
        - 予約から来店までの動線
        - 閑散期・特定曜日の集客テコ入れ
        - メニュー・価格の見せ方と客単価
        - 新規集客とリピートのバランス
        - 紹介・口コミが生まれる仕掛け
      tones:
        - です・ます調の丁寧な語り
        - だ・である調の言い切り
        - フランクな口語（友人に話すように）
        - ぶっちゃけ・内緒話トーン
        - 先輩経営者がアドバイスする口調
      ctas:
        - 同じ悩みの人に軽く手挙げを促す
        - コメントで業種や今の状況を聞く
        - あえて問いかけを置かず余韻で締める
        - 役立った人に向けて保存を促す
        - 続き・具体策を知りたい人を募る
      # 型の出現比率（重み）。①〜④で価値提供、⑤直球オファーは控えめ。
      type_weights:
        型①業種特化の反響事例型: 28
        型②常識の逆張り型: 24
        型③失敗あるある共感型: 24
        型④地域×業種リスト型: 16
        型⑤無料オファー直球型: 8

  # ---- A：副業AI層向け（既存ルール）----
  ai_sidehustle:
    rules_dir: rules
    persona_file: 01_persona.md
    region_words: []
    tag_location: false
    lead_keywords:
      - 欲しい
      - いります
      - 知りたい
      - 希望
      - やりたい
    offer: "AIで稼ぐ具体ノウハウ・テンプレ配布"

# ---- 投稿スケジュール ----
posting:
  # 承認モデル：6時間ごとに候補を自動生成→ダッシュボードで承認したものだけ投稿。
  # 1回の自動生成バッチで作る候補数（未承認として溜まる）
  candidates_per_batch: 3
  # 手動「今すぐ候補生成」やpost時の内部候補数（最良1本を選ぶ用）
  candidates: 2

# ---- 返信対応 ----
replies:
  # draft = 下書き承認制（推奨） / auto = 完全自動
  mode: draft
  # 1回の実行で処理する返信の最大数（レート＆事故防止）
  max_per_run: 20
  # 自分の直近何件の投稿の返信を見るか
  lookback_posts: 10

# ---- 安全弁（凍結リスク対策）----
safety:
  daily_post_cap: 8        # API上限250だが自主的に絞る
  daily_reply_cap: 80      # API上限1000だが自主的に絞る
  min_seconds_between_actions: 30
