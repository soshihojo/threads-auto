# =====================================================================
# Threads自動化システム 設定ファイル
# ペルソナ・オファー・スケジュール・リード検知をここで切り替える。
# （エンジンは共通。設定差し替えで副業層←→店舗オーナーを両対応できる）
# =====================================================================

# 現在アクティブなプロファイル名（profiles配下のキーを指定）
active_profile: local_owner

profiles:
  # ---- B：店舗オーナー向け（今回の事業）----
  local_owner:
    rules_dir: rules_local        # 投稿生成に使うルール集のフォルダ
    persona_file: 01_persona.md   # rules_dir内のペルソナ定義
    # 投稿のたびに本文へ織り込む地域ワード（ローカル露出狙い／ジオ配信は不可なのでテキストで取りにいく）
    # 投稿ごとにこの中から1つをランダムで使用。全47都道府県＋主要市区町村。
    region_words:
      # --- 47都道府県 ---
      - 北海道
      - 青森
      - 岩手
      - 宮城
      - 秋田
      - 山形
      - 福島
      - 茨城
      - 栃木
      - 群馬
      - 埼玉
      - 千葉
      - 東京
      - 神奈川
      - 新潟
      - 富山
      - 石川
      - 福井
      - 山梨
      - 長野
      - 岐阜
      - 静岡
      - 愛知
      - 三重
      - 滋賀
      - 京都
      - 大阪
      - 兵庫
      - 奈良
      - 和歌山
      - 鳥取
      - 島根
      - 岡山
      - 広島
      - 山口
      - 徳島
      - 香川
      - 愛媛
      - 高知
      - 福岡
      - 佐賀
      - 長崎
      - 熊本
      - 大分
      - 宮崎
      - 鹿児島
      - 沖縄
      # --- 主要市区町村・繁華街 ---
      - 札幌
      - 仙台
      - さいたま
      - 千葉市
      - 横浜
      - 川崎
      - 相模原
      - 新潟市
      - 静岡市
      - 浜松
      - 名古屋
      - 京都市
      - 大阪市
      - 梅田
      - 難波
      - 堺
      - 神戸
      - 岡山市
      - 広島市
      - 北九州
      - 福岡市
      - 天神
      - 博多
      - 熊本市
      - 鹿児島市
      - 那覇
    # 位置タグを付けるか（true=本文で選ばれた地域をそのまま位置タグ検索に使う）
    tag_location: true
    # 手挙げ＝リード判定キーワード（返信本文にこれらを含むとリード化）
    lead_keywords:
      - やりたい
      - 興味
      - 希望
      - 知りたい
      - 欲しい
      - 詳しく
      - お願い
      - 気になる
      - やってみたい
    # フロントのオファー（返信文・リード対応で参照）
    offer: "ポスティング代行・SNSアカウント運用・HP制作/リニューアルで地域集客を一気通貫サポート。まずは無料相談で今の集客の課題を整理する。"
    # 生成の多様化軸。投稿ごとに各リストから1つずつランダムに選び、似た投稿への収束を防ぐ。
    variation:
      industries:
        - 整体院
        - 美容室
        - 飲食店
        - 工務店・リフォーム会社
        - 学習塾
        - 歯科・クリニック
        - ネイル・まつげサロン
        - 整骨院
        - カフェ・喫茶店
        - エステサロン
        - ペットサロン
        - 不動産・賃貸仲介
        - 居酒屋
        - パーソナルジム
      # 話題は3商品（ポスティング代行/SNSアカウント運用/HP制作・リニューアル）と
      # その組み合わせに限定する。単品7割・組み合わせ3割くらいの感覚で混ぜる。
      topics:
        # --- ポスティング代行（単品） ---
        - ポスティングの配布エリア設計で反響が変わる話
        - チラシの内容・オファー（初回特典や地図）の作り込み
        - 枚数より「誰に・どこで配るか」が反響を決める話
        # --- HP制作・リニューアル（単品） ---
        - ホームページの問い合わせ導線・作りっぱなし問題
        - スマホで見たときの第一印象と離脱（見づらいHPの損失）
        - 古いHPをリニューアルしたら問い合わせが変わった話
        # --- SNSアカウント運用（単品） ---
        - Instagram/Threadsを使った地域集客
        - SNS投稿が続かない・成果が見えない問題の解き方
        - フォロワー数より「来店につながる」発信の考え方
        # --- 組み合わせ（クロスセル） ---
        - チラシ×HP（チラシのQRから見られるHPが弱いと反響を取りこぼす話）
        - SNS×HP（SNSで興味を持った人が最後に見るのはHPという話）
        - チラシ×SNS（オフラインとオンラインの両面から地域に露出する話）
        - チラシ・SNS・HPをまとめて設計すると集客が安定する話
      tones:
        - です・ます調の丁寧な語り
        - だ・である調の言い切り
        - フランクな口語（友人に話すように）
        - ぶっちゃけ・内緒話トーン
        - 先輩経営者がアドバイスする口調
      # ネタ元。実話は 06_real_cases.md の事実のみ使用可（捏造禁止）。一般論回は実績数字を主張しない。
      # region がある実話回は「その地域だけ」を本文・位置タグに使う（無関係な地域を混ぜない）。
      case_focus:
        - label: 実話A（大阪の石材屋×チラシ1,000部で数十件）
          region: 大阪
        - label: 実話B（奈良の整体院×5,000部で回数券成約11件）
          region: 奈良
        - label: 実話C（岡山の設備屋×約30万円の配布で650万円受注）
          region: 岡山
        - label: 実話D（兵庫の塗装店×HPリニューアル公開2日で新規問い合わせ）
          region: 兵庫
        - label: 実話E（宮崎の石材屋×HP公開2週間で問い合わせ・SNSフォロワー300人で問い合わせ3件）
          region: 宮崎
        - label: 一般論（実話を使わず、店主あるある・考え方で価値を出す回）
          region: ""
      # 締めは必ず「いいね」で統一（コメントはハードルが高いので使わない）。
      # かつ「何に対するいいねか」を必ず明示する（サービス名・やってほしい事を入れる）。
      # 「次に投稿します」等、実行しない約束は絶対にしない。
      ctas:
        - 「チラシでの集客を試してみたい方はいいねください」のように、サービス名を入れて促す
        - 「うちの店でもやってほしい、という方はいいねください」と促す
        - 「無料で相談に乗っています。気になる方はいいねください」と促す
        - 「◯◯（投稿で扱ったサービス）、うちもやってみたいという方はいいね」と促す
      # 型の出現比率（重み）。型⑥（実体験ショート型）は実際に2アポ取れた勝ち型なので最優先。
      type_weights:
        型⑥実体験ショート型: 40
        型①業種特化の反響事例型: 14
        型②常識の逆張り型: 14
        型③失敗あるある共感型: 12
        型④地域×業種リスト型: 12
        型⑤無料オファー直球型: 8

  # ---- A：副業AI層向け（既存ルール）----
  ai_sidehustle:
    rules_dir: rules
    persona_file: 01_persona.md
    region_words: []
    tag_location: false
    lead_keywords:
      - 欲しい
      - いります
      - 知りたい
      - 希望
      - やりたい
    offer: "AIで稼ぐ具体ノウハウ・テンプレ配布"

# ---- 投稿スケジュール ----
posting:
  # 承認モデル：6時間ごとに候補を自動生成→ダッシュボードで承認したものだけ投稿。
  # 1回の自動生成バッチで作る候補数（未承認として溜まる）
  candidates_per_batch: 1
  # 手動「今すぐ候補生成」やpost時の内部候補数（最良1本を選ぶ用）
  candidates: 2

# ---- 返信対応 ----
replies:
  # draft = 下書き承認制（推奨） / auto = 完全自動
  mode: draft
  # 1回の実行で処理する返信の最大数（レート＆事故防止）
  max_per_run: 20
  # 自分の直近何件の投稿の返信を見るか
  lookback_posts: 10

# ---- 安全弁（凍結リスク対策）----
safety:
  daily_post_cap: 8        # API上限250だが自主的に絞る
  daily_reply_cap: 80      # API上限1000だが自主的に絞る
  min_seconds_between_actions: 30
