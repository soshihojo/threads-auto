# ---- 投稿スケジュール ----
posting:
  # 承認モデル：12時間ごとに候補を自動生成→ダッシュボードで承認したものだけ投稿。
  # 1回の自動生成バッチで作る候補数（未承認として溜まる）
  candidates_per_batch: 1
  # 手動「今すぐ候補生成」やpost時の内部候補数（最良1本を選ぶ用）
  candidates: 2

# ---- 返信対応 ----
replies:
  # draft = 下書き承認制 / auto = 完全自動
  # ★2026-08-12：autoに切替。巡回を1時間おきにして、1回の件数を絞る運用にする。
  #   まとめて20件出すより、少しずつ出す方が事故に早う気づける。
  mode: auto
  # 1回の実行で処理する返信の最大数（レート＆事故防止）
  # ★2026-08-14：10→20。1時間おきに回るとはいえ、バズると1本に200件以上コメントが付く。
  #   10やと消化に丸一日かかって、返す頃には相手はもう見てへん。
  #   30秒間隔で送るので、20件でも1回あたり10分。ジョブの時間には収まる。
  max_per_run: 20
  # 自分の直近何件の投稿の返信を見るか
  # ★25に拡大（2026-07-18）: バズ投稿は数日後もコメントが付くが、投稿が増えると
  # 10件の窓から外れて巡回されなくなるため（7/13のバズ投稿が実際に窓落ちした）
  lookback_posts: 25

# ---- 安全弁（凍結リスク対策）----
safety:
  daily_post_cap: 8        # API上限250だが自主的に絞る
  daily_reply_cap: 80      # API上限1000だが自主的に絞る
  min_seconds_between_actions: 30
