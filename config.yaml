# =====================================================================
# Threads自動化システム 設定ファイル
# ペルソナ・オファー・スケジュール・リード検知をここで切り替える。
# （エンジンは共通。設定差し替えで副業層←→店舗オーナーを両対応できる）
# =====================================================================

# 現在アクティブなプロファイル名（profiles配下のキーを指定）
active_profile: local_owner

profiles:
  # ---- B：店舗オーナー向け（今回の事業）----
  local_owner:
    rules_dir: rules_local        # 投稿生成に使うルール集のフォルダ
    persona_file: 01_persona.md   # rules_dir内のペルソナ定義
    # 投稿のたびに本文へ織り込む地域ワード（ローカル露出狙い／ジオ配信は不可なのでテキストで取りにいく）
    # 投稿ごとにこの中から1つをランダムで使用。全47都道府県＋主要市区町村。
    region_words:
      # --- 47都道府県 ---
      - 北海道
      - 青森
      - 岩手
      - 宮城
      - 秋田
      - 山形
      - 福島
      - 茨城
      - 栃木
      - 群馬
      - 埼玉
      - 千葉
      - 東京
      - 神奈川
      - 新潟
      - 富山
      - 石川
      - 福井
      - 山梨
      - 長野
      - 岐阜
      - 静岡
      - 愛知
      - 三重
      - 滋賀
      - 京都
      - 大阪
      - 兵庫
      - 奈良
      - 和歌山
      - 鳥取
      - 島根
      - 岡山
      - 広島
      - 山口
      - 徳島
      - 香川
      - 愛媛
      - 高知
      - 福岡
      - 佐賀
      - 長崎
      - 熊本
      - 大分
      - 宮崎
      - 鹿児島
      - 沖縄
      # --- 主要市区町村・繁華街 ---
      - 札幌
      - 仙台
      - さいたま
      - 千葉市
      - 横浜
      - 川崎
      - 相模原
      - 新潟市
      - 静岡市
      - 浜松
      - 名古屋
      - 京都市
      - 大阪市
      - 梅田
      - 難波
      - 堺
      - 神戸
      - 岡山市
      - 広島市
      - 北九州
      - 福岡市
      - 天神
      - 博多
      - 熊本市
      - 鹿児島市
      - 那覇
    # 位置タグを付けるか（true=本文で選ばれた地域をそのまま位置タグ検索に使う）
    tag_location: true
    # 手挙げ＝リード判定キーワード（返信本文にこれらを含むとリード化）
    lead_keywords:
      - やりたい
      - 興味
      - 希望
      - 知りたい
      - 欲しい
      - 詳しく
      - お願い
      - 気になる
      - やってみたい
    # フロントのオファー（返信文・リード対応で参照）
    offer: "ポスティング・HP制作・ネット広告・SNS運用で地域集客を一気通貫サポート。まずは無料相談で今の集客の課題を整理する。"
    # 生成の多様化軸。投稿ごとに各リストから1つずつランダムに選び、似た投稿への収束を防ぐ。
    variation:
      industries:
        - 整体院
        - 美容室
        - 飲食店
        - 工務店・リフォーム会社
        - 学習塾
        - 歯科・クリニック
        - ネイル・まつげサロン
        - 整骨院
        - カフェ・喫茶店
        - エステサロン
        - ペットサロン
        - 不動産・賃貸仲介
        - 居酒屋
        - パーソナルジム
      # 話題は4サービス（ポスティング/HP/広告/SNS運用）に関わるものに限定する。
      topics:
        # --- ポスティング ---
        - ポスティングの配布エリア設計で反響が変わる話
        - チラシの内容・オファー（初回特典や地図）の作り込み
        - 枚数より「誰に・どこで配るか」が反響を決める話
        - チラシから来店・問い合わせまでの動線（QRやHP誘導）
        # --- HP（ホームページ） ---
        - ホームページの問い合わせ導線・作りっぱなし問題
        - スマホで見たときの第一印象と離脱（見づらいHPの損失）
        - HPは24時間働く営業マンという考え方
        - チラシや広告の受け皿としてのHPの役割
        # --- 広告 ---
        - Google/Instagram広告の地域ターゲティング
        - 少額予算でも成果を出すネット広告の出し方
        - 広告とHP・チラシを組み合わせる集客設計
        - 広告の費用対効果（CPAや回収）の素朴な見方
        # --- SNS運用 ---
        - Instagram/Threadsを使った地域集客
        - SNS投稿が続かない・成果が見えない問題の解き方
        - フォロワー数より「来店につながる」発信の考え方
        - SNSと広告・HPを連携させて集客を伸ばす話
      tones:
        - です・ます調の丁寧な語り
        - だ・である調の言い切り
        - フランクな口語（友人に話すように）
        - ぶっちゃけ・内緒話トーン
        - 先輩経営者がアドバイスする口調
      # 締めは超低ハードルの手挙げで軽く誘導（最終的に無料相談につながる）。1行で短く。
      ctas:
        - 「試してみたい方はいいねください」と軽く手挙げを促す
        - 「気になる人はいいね」とだけ添える
        - 「やり方を知りたい人はコメントで『興味』と」と促す
        - 「同じ悩みの人いる？」と軽く問いかける
        - 「コメントで業種を教えてくれたら、合うやり方を返します」と誘導する
      # 型の出現比率（重み）。型⑥（実体験ショート型）は実際に2アポ取れた勝ち型なので最優先。
      type_weights:
        型⑥実体験ショート型: 40
        型①業種特化の反響事例型: 14
        型②常識の逆張り型: 14
        型③失敗あるある共感型: 12
        型④地域×業種リスト型: 12
        型⑤無料オファー直球型: 8

  # ---- A：副業AI層向け（既存ルール）----
  ai_sidehustle:
    rules_dir: rules
    persona_file: 01_persona.md
    region_words: []
    tag_location: false
    lead_keywords:
      - 欲しい
      - いります
      - 知りたい
      - 希望
      - やりたい
    offer: "AIで稼ぐ具体ノウハウ・テンプレ配布"

# ---- 投稿スケジュール ----
posting:
  # 承認モデル：6時間ごとに候補を自動生成→ダッシュボードで承認したものだけ投稿。
  # 1回の自動生成バッチで作る候補数（未承認として溜まる）
  candidates_per_batch: 3
  # 手動「今すぐ候補生成」やpost時の内部候補数（最良1本を選ぶ用）
  candidates: 2

# ---- 返信対応 ----
replies:
  # draft = 下書き承認制（推奨） / auto = 完全自動
  mode: draft
  # 1回の実行で処理する返信の最大数（レート＆事故防止）
  max_per_run: 20
  # 自分の直近何件の投稿の返信を見るか
  lookback_posts: 10

# ---- 安全弁（凍結リスク対策）----
safety:
  daily_post_cap: 8        # API上限250だが自主的に絞る
  daily_reply_cap: 80      # API上限1000だが自主的に絞る
  min_seconds_between_actions: 30
