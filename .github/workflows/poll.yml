name: threads-poll
# 返信ポーリング＋リード検知＋通知（数時間おき）。インサイトは1日1回。
# 返信送信は draft モードなので承認待ち。リード通知はここで飛ぶ。
on:
  schedule:
    # ★2026-08-14：JST 9〜23時だけやったのを、24時間に広げた。
    #   実害：深夜4時に付いたコメントが、9時の回まで5時間放置された。
    #   投稿は22時・23時・2時が数字の出る時間帯やと実測で分かっとる。
    #   つまりコメントも深夜に付く。そこを丸ごと取りこぼしとった。
    - cron: "0 * * * *"     # 毎時0分（24時間）
  workflow_dispatch: {}

# ★2026-08-22：巡回も重ねん。重なると、同じコメントに二回返す事故になる。
concurrency:
  group: threads-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      STORE_BACKEND: sheets
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_KEY: ${{ secrets.GOOGLE_SHEET_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
      CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: replies + leads
        run: python -m src.main replies
      - name: insights (once a day at JST 21時)
        # ★2026-08-02: cronを2時間おきに変えた際に、この条件が古い cron 文字列のまま
        # 取り残されて一致せず、7/18以降 insights が一度も実行されていなかった。
        # 対象は直近25投稿と軽いので、毎回実行する。
        continue-on-error: true
        run: python -m src.main insights
