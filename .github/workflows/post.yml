name: threads-generate
# 6時間ごとに投稿候補を自動生成 → 共有ストア(Sheets)にpending_reviewで溜める。
# 投稿は、ダッシュボードで承認 → scheduler(run-due)が配信する。
on:
  schedule:
    - cron: "0 */6 * * *"   # 6時間おき（UTC 0/6/12/18 = JST 9/15/21/3）
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      STORE_BACKEND: sheets
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_KEY: ${{ secrets.GOOGLE_SHEET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
      CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: generate candidates (pending review)
        run: python -m src.main generate
