name: threads-scheduler
# 予約投稿の実行。15分おきに共有ストア(Sheets)のキューを見て、時刻が来た予約を自動投稿。
on:
  schedule:
    - cron: "*/15 * * * *"   # 15分おき
  workflow_dispatch: {}

# ★★★2026-08-22：同時に走らんようにする。ここが二重投稿の原因やった。
#   GitHub Actions の cron は、混んどると遅れて走る。遅れた回と次の回が重なると、
#   両方が同じ「まだ scheduled の行」を掴んで、二本とも投稿してまう。
#   ★実際、8/17〜18で同じ本文が10本、15秒〜2分ちがいで二重に出とった。
#   ★★schedule.run_due には was_posted_before いう保険があるが、あれは
#     「前の回の投稿が posts に書かれた後」やないと効かん。同時に走ったら両方すり抜ける。
#   ★★★せやから、そもそも重ねん。走っとる間に来た回は、待たせんと捨てる（投稿は次の回で拾える）。
concurrency:
  group: threads-scheduler
  cancel-in-progress: false

jobs:
  run-due:
    runs-on: ubuntu-latest
    env:
      STORE_BACKEND: sheets
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_KEY: ${{ secrets.GOOGLE_SHEET_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: refresh token
        run: python -m src.main refresh-token || true
      - name: run due scheduled posts
        run: python -m src.main run-due
