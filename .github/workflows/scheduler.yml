name: threads-scheduler
# 予約投稿の実行。15分おきに共有ストア(Sheets)のキューを見て、時刻が来た予約を自動投稿。
on:
  schedule:
    - cron: "*/15 * * * *"   # 15分おき
  workflow_dispatch: {}

# ★★★2026-08-22：同時に走らんようにする。ここが二重投稿の原因やった。
#   GitHub Actions の cron は、混んどると遅れて走る。遅れた回と次の回が重なると、
#   両方が同じ「まだ scheduled の行」を掴んで、二本とも投稿してまう。
#   ★実際、8/17〜18で同じ本文が10本、15秒〜2分ちがいで二重に出とった。
#   ★★schedule.run_due には was_posted_before いう保険があるが、あれは
#     「前の回の投稿が posts に書かれた後」やないと効かん。同時に走ったら両方すり抜ける。
#   ★★★せやから、そもそも重ねん。走っとる間に来た回は、待たせんと捨てる（投稿は次の回で拾える）。
jobs:
  run-due:
    runs-on: ubuntu-latest
    # ★2026-08-31：アカウントごとに回す。fail-fast は切る
    #   （片方が落ちても、もう片方の投稿は出したいため）。
    strategy:
      fail-fast: false
      matrix:
        account: [a, b]
    # ★同時に走らんようにする。ここが二重投稿の原因やった（下の但し書き参照）。
    #   ★アカウントごとに別のグループにする。二本が互いを待つ必要は無い。
    concurrency:
      group: threads-scheduler-${{ matrix.account }}
      cancel-in-progress: false
    env:
      STORE_BACKEND: sheets
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_KEY: ${{ secrets.GOOGLE_SHEET_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN_B: ${{ secrets.THREADS_ACCESS_TOKEN_B }}
      THREADS_USER_ID_B: ${{ secrets.THREADS_USER_ID_B }}
      GH_SECRET_WRITE_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: refresh token
        run: python -m src.main refresh-token --account ${{ matrix.account }} || true
      - name: run due scheduled posts
        run: python -m src.main run-due --account ${{ matrix.account }}

  # ★★★2026-08-31 新設：コメント返信を、ここでも回す。
  #
  #   なんで scheduler に相乗りさせるか。
  #   ★poll.yml の schedule が【7時間半、一度も発火せんかった】。実害：返信が丸ごと止まった。
  #   ★★GitHub Actions の schedule はベストエフォートで、間引かれる時は間引かれる。
  #     8/29に cron を "17,47" にずらして混雑を避けたが、それでも死んだ。★根治せん。
  #   ★★★対して、この scheduler は【外部から workflow_dispatch で15分おきに叩かれとる】。
  #     実測：13:00 / 13:15 / 13:30 / 13:45… と、途切れず動いとる。
  #     ★せやから、確実に動いとる方の便に、返信を相乗りさせる。
  #
  #   投稿が遅れんのか。★遅れん。
  #   ★★GitHub Actions の【ジョブは並列に走る】。run-due とは別のジョブやから、
  #     返信が何分かかろうと、投稿はいつも通り即座に出る。
  #     （実測：巡回は3.5〜9分、scheduler本体は1分未満。15分間隔に十分収まる）
  #
  #   二重に返信せんのか。★せん。
  #   ★★concurrency のグループ名を poll.yml と【同じ】にしてある。
  #     グループはリポジトリ全体で共有されるんで、poll.yml の cron が生き返っても、
  #     同じアカウントの巡回は常に一本しか走らん。
  #   ★★★ほんで processed_replies の既読の印もあるんで、二重返信は二重に防がれとる。
  #
  #   ★poll.yml は消さん。二つの経路から起動される方が、片方が死んでも止まらん。
  replies:
    runs-on: ubuntu-latest
    # ★★★2026-08-31：投稿が終わってから走らせる。
    #   ★同時に走らせたら、4ジョブがいっぺんにSheetsを叩いて【429】になった。
    #     実害：run-due が両アカウントとも落ちて、投稿が止まった。
    #   ★★投稿を先に通す。run-due は一分もかからんので、返信の遅れは誤差や。
    #   ★★★投稿の方が時間に厳しい（予約時刻がある）。返信は数分ずれてもかまへん。
    needs: run-due
    strategy:
      fail-fast: false
      matrix:
        account: [a, b]
    concurrency:
      group: threads-poll-${{ matrix.account }}   # ★poll.yml と同じ名前にすること
      cancel-in-progress: false
    env:
      STORE_BACKEND: sheets
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_KEY: ${{ secrets.GOOGLE_SHEET_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN_B: ${{ secrets.THREADS_ACCESS_TOKEN_B }}
      THREADS_USER_ID_B: ${{ secrets.THREADS_USER_ID_B }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
      CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: replies + leads
        run: python -m src.main replies --account ${{ matrix.account }}
